  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var $ = function (id) { return document.getElementById(id); };
      var tl = gsap.timeline({ paused: true });
      var DUR = 6.8;

      // svg-path-draw setup: measured lengths
      var drawIds = ["a01-apertura-table", "a01-apertura-leg-l", "a01-apertura-leg-r",
        "a01-apertura-cloud", "a01-apertura-house", "a01-apertura-cal", "a01-apertura-cal-bar",
        "a01-apertura-check"];
      drawIds.forEach(function (id) {
        var p = $(id);
        var len = p.getTotalLength() * 1.02;
        p.style.strokeDasharray = len + "";
        p.style.strokeDashoffset = len + "";
      });
      function draw(id, at, dur) {
        tl.to($(id), { strokeDashoffset: 0, duration: dur, ease: "power2.out" }, at);
      }
      function rise(el, at, dur, dy) {
        tl.fromTo(el, { opacity: 0, y: dy || 40 }, { opacity: 1, y: 0, duration: dur || 0.9, ease: "power3.out" }, at);
      }

      // progress bar: frame 1 of a ~60s video
      tl.fromTo($("a01-apertura-progress"), { scaleX: 0 }, { scaleX: 0.1134, duration: DUR, ease: "none" }, 0);

      // ── Scene 1 (0.0–2.4s): table self-draws, family rises, icons arc in on "fenómeno"
      tl.set([$("a01-apertura-table"), $("a01-apertura-cloud"), $("a01-apertura-cal")], { fillOpacity: 0 }, 0);
      tl.fromTo($("a01-apertura-floor"), { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 0.1);
      draw("a01-apertura-table", 0.1, 0.8);
      draw("a01-apertura-leg-l", 0.68, 0.45);
      draw("a01-apertura-leg-r", 0.78, 0.45);
      tl.to($("a01-apertura-table"), { fillOpacity: 1, duration: 0.5, ease: "power1.out" }, 0.95);

      rise($("a01-apertura-adult-l"), 0.25, 0.9);
      rise($("a01-apertura-child"), 0.42, 0.9);
      rise($("a01-apertura-adult-r"), 0.58, 0.9);
      rise($("a01-apertura-book"), 0.85, 0.8, 24);

      // "fenómeno" ≈1.54s
      rise($("a01-apertura-pill"), 1.5, 0.8, 30);
      draw("a01-apertura-cloud", 1.55, 0.7);
      tl.to($("a01-apertura-cloud"), { fillOpacity: 1, duration: 0.4, ease: "power1.out" }, 2.15);
      draw("a01-apertura-house", 1.78, 0.7);
      draw("a01-apertura-cal", 2.0, 0.6);
      draw("a01-apertura-cal-bar", 2.35, 0.4);
      tl.to($("a01-apertura-cal"), { fillOpacity: 1, duration: 0.4, ease: "power1.out" }, 2.5);
      tl.fromTo($("a01-apertura-cal-dots"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 2.55);

      // live SVG internals: slow rain drops, deterministic unrolled cycles
      var drops = ["a01-apertura-drop-1", "a01-apertura-drop-2", "a01-apertura-drop-3"];
      var CYCLE = 1.5;
      drops.forEach(function (id, i) {
        var el = $(id);
        tl.set(el, { opacity: 0, y: 0 }, 0);
        for (var t = 2.1 + i * 0.5; t < DUR; t += CYCLE) {
          var fall = Math.min(1.3, DUR - t);
          tl.fromTo(el, { y: 0 }, { y: 30, duration: fall, ease: "none", immediateRender: false }, t);
          tl.fromTo(el, { opacity: 0 }, { opacity: 0.9, duration: Math.min(0.35, fall), ease: "power1.out", immediateRender: false }, t);
          if (fall > 0.75) {
            tl.to(el, { opacity: 0, duration: 0.45, ease: "power1.in" }, t + fall - 0.45);
          }
        }
      });

      // ── Scene 2 (2.4–5.6s): title slide-up crossfade on "preparar" ≈3.1s; adult points; check draws
      tl.fromTo($("a01-apertura-title"), { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 1.0, ease: "power3.out" }, 3.1);
      tl.fromTo($("a01-apertura-arm"), { rotation: 0, svgOrigin: "708 470" }, { rotation: 24, svgOrigin: "708 470", duration: 0.75, ease: "power3.out" }, 3.75);
      draw("a01-apertura-check", 4.35, 0.5);

      // ── Scene 3 (5.6–6.8s): heart on "familia" ≈5.6s, then quiet hold (drops only)
      tl.fromTo($("a01-apertura-heart"),
        { opacity: 0, y: 20, scale: 0.85, transformOrigin: "50% 100%" },
        { opacity: 1, y: 0, scale: 1, transformOrigin: "50% 100%", duration: 0.7, ease: "power3.out" }, 5.6);

      // full-span anchor
      tl.to({}, { duration: DUR }, 0);
      window.__timelines["01-apertura"] = tl;
    })();
  </script>
