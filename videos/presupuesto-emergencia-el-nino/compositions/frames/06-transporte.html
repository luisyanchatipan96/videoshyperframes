    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      (function () {
        var FID = "06-transporte";
        var $ = function (s) { return document.getElementById(FID + "-" + s); };

        var road = $("road");
        var reveal = $("route-reveal");
        var bus = $("bus");
        var car = $("car");
        var busW = [$("bus-w1"), $("bus-w2")];
        var carW = [$("car-w1"), $("car-w2")];
        var busHubs = [[-48, -14], [50, -14]];
        var carHubs = [[-32, -14], [34, -14]];

        var L = road.getTotalLength();

        // length along the road where x first reaches targetX (deterministic bisection)
        function lenAtX(targetX) {
          var lo = 0, hi = L;
          for (var i = 0; i < 40; i++) {
            var mid = (lo + hi) / 2;
            if (road.getPointAtLength(mid).x < targetX) lo = mid; else hi = mid;
          }
          return (lo + hi) / 2;
        }

        var BUS_READY = lenAtX(150);   // bus fully inside the card at the road start
        var BUS_STOP = lenAtX(570);    // bus parked at the health-center door
        var CAR_STOP = lenAtX(392);    // car parked beside the meeting point

        // mask self-draw: measured length, one dash
        var RL = reveal.getTotalLength() * 1.05;
        reveal.style.strokeDasharray = RL + " " + RL;
        reveal.style.strokeDashoffset = RL;

        var st = { bus: 0, car: 0, spin: 0 };

        function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

        function place(g, wheels, hubs, r, d) {
          var p = road.getPointAtLength(d);
          var q = road.getPointAtLength(Math.min(L, d + 2));
          var o = road.getPointAtLength(Math.max(0, d - 2));
          var ang = Math.atan2(q.y - o.y, q.x - o.x) * 180 / Math.PI;
          ang = clamp(ang, -26, 26);
          g.setAttribute("transform", "translate(" + p.x.toFixed(2) + " " + p.y.toFixed(2) + ") rotate(" + ang.toFixed(2) + ")");
          var rot = (d / r) * (180 / Math.PI) + st.spin;
          for (var i = 0; i < wheels.length; i++) {
            wheels[i].setAttribute("transform", "rotate(" + rot.toFixed(2) + " " + hubs[i][0] + " " + hubs[i][1] + ")");
          }
        }

        function render() {
          place(bus, busW, busHubs, 15, st.bus);
          place(car, carW, carHubs, 14, st.car);
        }
        render();

        var tl = gsap.timeline({ paused: true, onUpdate: render });

        // ---- Scene 1 (0.0–1.0): template + gray S road; chips already present ----
        tl.fromTo($("progress-fill"), { scaleX: 0.6644 }, { scaleX: 0.8198, duration: 9.32, ease: "none" }, 0);
        tl.fromTo($("pill"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.05);
        tl.fromTo($("title"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.15);
        tl.fromTo($("card"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.25);
        tl.fromTo($("road-g"), { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 0.5);
        // destinations sit faint on the map until named
        tl.fromTo($("health"), { opacity: 0, y: 30 }, { opacity: 0.35, y: 0, duration: 0.6, ease: "power3.out" }, 0.6);
        tl.fromTo($("meet"), { opacity: 0, y: 30 }, { opacity: 0.35, y: 0, duration: 0.6, ease: "power3.out" }, 0.7);

        // ---- Scene 2 (1.0–3.1): ticket on "pasajes", drop on "combustible", bus enters ----
        tl.fromTo($("ticket"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 1.5);
        tl.fromTo($("drop"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 2.18);
        tl.fromTo(st, { bus: 0 }, { bus: BUS_READY, duration: 0.85, ease: "power2.out", onUpdate: render }, 2.2);

        // ---- Scene 3 (3.1–6.2): route draws green, bus → health center, car → meeting point ----
        tl.fromTo($("subtitle"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 3.1);
        tl.fromTo(reveal, { strokeDashoffset: RL }, { strokeDashoffset: 0, duration: 1.3, ease: "power2.out" }, 3.14);
        tl.fromTo(st, { bus: BUS_READY }, { bus: BUS_STOP, duration: 1.7, ease: "power2.inOut", onUpdate: render, immediateRender: false }, 3.45);
        tl.fromTo($("health"), { opacity: 0.35 }, { opacity: 1, duration: 0.5, ease: "power1.out", immediateRender: false }, 3.6);
        tl.fromTo($("meet"), { opacity: 0.35 }, { opacity: 1, duration: 0.5, ease: "power1.out", immediateRender: false }, 4.77);
        tl.fromTo(st, { car: 0 }, { car: CAR_STOP, duration: 1.3, ease: "power2.inOut", onUpdate: render }, 4.8);

        // ---- Scene 4 (6.2–9.32): info sign on "indicaciones"; hold, wheels turn slowly ----
        tl.fromTo($("sign"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 6.84);
        tl.fromTo(st, { spin: 0 }, { spin: 120, duration: 3.12, ease: "none", onUpdate: render }, 6.2);

        render();

        window.__timelines = window.__timelines || {};
        window.__timelines[FID] = tl;
      })();
