    tl.fromTo(byClass("dot"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power3.out", stagger: 0.12 }, 0.35);

    var CARD_T = 0.49, OFF = 300;

    tl.fromTo(byId("card-b"), { opacity: 0, x:  OFF, y: -OFF }, { opacity: 1, x: 0, y: 0, duration: 0.95, ease: "power3.out" }, CARD_T);
