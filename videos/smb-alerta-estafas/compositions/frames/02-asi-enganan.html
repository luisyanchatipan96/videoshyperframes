    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      (function(){
        var R = "[data-composition-id='02-asi-enganan'] ";
        function q(id){ return document.querySelector(R + "#" + id); }
        var tl = gsap.timeline({ paused: true });
        // Scene 1 — title + phone rise
        tl.fromTo(q("f02-title"), {opacity:0, y:40, filter:"blur(12px)"}, {opacity:1, y:0, filter:"blur(0px)", duration:0.6, ease:"power3.out"}, 0);
        tl.fromTo(q("f02-phone"), {opacity:0, y:140, filter:"blur(10px)"}, {opacity:1, y:0, filter:"blur(0px)", duration:0.8, ease:"expo.out"}, 0.1);
        // Scene 2 — typing indicator (0.5s) then message
        function msg(n, t, originX){
          var ty = q("f02-t" + n), m = q("f02-m" + n), dots = ty.querySelectorAll("i");
          tl.fromTo(ty, {opacity:0, scale:0.85, transformOrigin:originX + " bottom"}, {opacity:1, scale:1, duration:0.15, ease:"power3.out"}, t - 0.5);
          for (var d = 0; d < 3; d++) {
            var s0 = t - 0.45 + d * 0.08;
            tl.fromTo(dots[d], {y:0}, {y:-9, duration:0.12, ease:"sine.out"}, s0);
            tl.to(dots[d], {y:0, duration:0.12, ease:"sine.in"}, s0 + 0.12);
          }
          tl.to(ty, {opacity:0, duration:0.1, ease:"none"}, t);
          tl.fromTo(m, {opacity:0, y:24, scale:0.96, filter:"blur(8px)", transformOrigin:originX + " bottom"}, {opacity:1, y:0, scale:1, filter:"blur(0px)", duration:0.5, ease:"power3.out"}, t);
        }
        msg(1, 1.0, "left");
        msg(2, 2.6, "left");
        tl.fromTo(q("f02-hl"), {backgroundSize:"0% 100%"}, {backgroundSize:"100% 100%", duration:0.6, ease:"power3.out"}, 2.95);
        msg(3, 4.0, "right");
        msg(4, 5.0, "left");
        // Scene 3 — ESTAFA stamp lands at 6.1s, chat dims to 70%
        var st = q("f02-stamp");
        tl.fromTo(st, {opacity:0, scale:1.6, rotation:-12, transformOrigin:"50% 50%"}, {opacity:1, scale:1, rotation:-12, duration:0.22, ease:"power4.in"}, 6.1);
        tl.fromTo(q("f02-chat"), {opacity:1}, {opacity:0.7, duration:0.4, ease:"power2.out"}, 6.25);
        var sh = [q("f02-phone"), st];
        tl.to(sh, {x:10, duration:0.035, ease:"none"}, 6.32);
        tl.to(sh, {x:-8, duration:0.04, ease:"none"}, 6.355);
        tl.to(sh, {x:5, duration:0.04, ease:"none"}, 6.395);
        tl.to(sh, {x:0, duration:0.035, ease:"none"}, 6.435);
        // hold
        tl.set({}, {}, 10);
        window.__timelines["02-asi-enganan"] = tl;
      })();
    </script>
