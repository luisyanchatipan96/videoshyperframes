<template id="01-alerta-template">
  <div id="root" data-composition-id="01-alerta" data-start="0" data-duration="7.5" data-width="1080" data-height="1920">
    <style>
      @font-face{font-family:'Poppins';src:url('assets/fonts/Poppins_400.woff2') format('woff2');font-weight:400;}@font-face{font-family:'Poppins';src:url('assets/fonts/Poppins_500.woff2') format('woff2');font-weight:500;}@font-face{font-family:'Poppins';src:url('assets/fonts/Poppins_600.woff2') format('woff2');font-weight:600;}@font-face{font-family:'Poppins';src:url('assets/fonts/Poppins_700.woff2') format('woff2');font-weight:700;}@font-face{font-family:'Poppins';src:url('assets/fonts/Poppins_800.woff2') format('woff2');font-weight:800;}
      #root{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:'Poppins',sans-serif;}
      [data-k="bg"]{position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 30%, #FFFFFF 0%, #F5F5F7 60%, #ECEDF1 100%);}
      [data-k="layer"]{position:absolute;inset:0;}
      .h{position:absolute;left:70px;right:70px;margin:0;text-align:center;color:#04478C;font-weight:700;letter-spacing:-0.03em;line-height:1.08;}
      .g{color:#4DC600;} .r{color:#E5484D;}
      .sub{position:absolute;left:80px;right:80px;margin:0;text-align:center;color:#5B6B7F;font-weight:500;}
      .card{position:absolute;background:#fff;border-radius:36px;box-shadow:0 30px 70px rgba(4,71,140,.14),0 6px 16px rgba(4,71,140,.08);}
      .phone{position:absolute;background:#1d1d23;border-radius:86px;box-shadow:0 50px 90px rgba(4,71,140,.22);}
      .screen{position:absolute;left:22px;top:22px;right:22px;bottom:22px;border-radius:66px;overflow:hidden;background:#ECE5DD;}
      .bub{position:absolute;max-width:470px;padding:22px 28px;border-radius:28px;font-size:34px;line-height:1.3;color:#1b1b1b;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.06);}
      .row{position:absolute;left:90px;right:90px;height:170px;display:block;}
      .row .ic{position:absolute;left:24px;top:33px;width:104px;height:104px;border-radius:30px;display:flex;align-items:center;justify-content:center;}
      .row .tx{position:absolute;left:156px;right:24px;top:0;height:170px;display:flex;align-items:center;font-size:46px;font-weight:600;color:#04478C;line-height:1.15;}
      .pin{position:absolute;width:0;height:0;}
      .pin .dot{position:absolute;left:-30px;top:-74px;width:60px;height:60px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#4DC600;box-shadow:0 10px 20px rgba(77,198,0,.35);}
      .pin .dot:after{content:"";position:absolute;left:19px;top:19px;width:22px;height:22px;border-radius:50%;background:#fff;}
      .pin .lb{position:absolute;white-space:nowrap;font-size:40px;font-weight:700;color:#04478C;}
    </style>
    <div data-k="bg" class="clip" data-start="0" data-duration="7.5" data-track-index="0"></div>
    <div data-k="layer" class="clip" data-start="0" data-duration="7.5" data-track-index="1">
      <div id="01-alerta-stamp" style="position:absolute;left:380px;top:170px;padding:16px 44px;border-radius:999px;background:#E5484D;color:#fff;font-size:56px;font-weight:800;letter-spacing:.04em;box-shadow:0 16px 30px rgba(229,72,77,.35);">¡ALERTA!</div>
      <p class="h" style="top:330px;font-size:78px;"><span id="01-alerta-l1" style="display:block;">¿Te escribió un</span><span id="01-alerta-l2" style="display:block;">«asesor de crédito»</span><span id="01-alerta-l3" style="display:block;">por WhatsApp?</span></p>
      <div id="01-alerta-phone" class="phone" style="left:240px;top:760px;width:600px;height:1080px;"><div class="screen" style="background:linear-gradient(180deg,#1f3a5f,#0d1b2e);">
        <div style="position:absolute;left:0;right:0;top:120px;text-align:center;color:#fff;font-size:120px;font-weight:600;">9:41</div>
        <div id="01-alerta-notif" style="position:absolute;left:28px;right:28px;top:330px;padding:26px 30px;border-radius:34px;background:rgba(255,255,255,.92);">
          <div style="display:flex;align-items:center;gap:16px;"><div style="width:58px;height:58px;border-radius:16px;background:#25D366;display:flex;align-items:center;justify-content:center;"><svg width="40" height="40" viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" style="color:#fff"><path d="M8 12h32v20H22l-8 7v-7H8z"/></svg></div><div style="font-size:28px;color:#555;font-weight:600;">WhatsApp · ahora</div></div>
          <div style="margin-top:14px;font-size:34px;font-weight:700;color:#111;">Asesor de Crédito</div>
          <div style="font-size:31px;color:#333;line-height:1.3;">Hola, le escribo de la Cooperativa San Miguel de los Bancos…</div>
        </div>
      </div></div>
    </div>
    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      (function(){
        var q = function(id){ return document.querySelector('[id="01-alerta-' + id + '"]'); };
        var phone = q('phone'), notif = q('notif'), stamp = q('stamp');
        var tl = gsap.timeline({ paused: true });
        // Scene 1 — phone rises, sharpens
        tl.fromTo(phone, { y: 300, opacity: 0, filter: 'blur(18px)' },
          { y: 0, opacity: 1, filter: 'blur(0px)', duration: 0.9, ease: 'power3.out' }, 0);
        // deterministic vibration: 4 fast cycles of x ±8px from 0.5s
        function buzz(at){
          var seq = [8, -8, 8, -8, 8, -8, 8, -8, 0];
          for (var i = 0; i < seq.length; i++) {
            tl.to(phone, { x: seq[i], duration: 0.045, ease: 'none' }, at + i * 0.045);
          }
        }
        buzz(0.5);
        // notification drops in from the top of the screen
        tl.fromTo(notif, { y: -180, opacity: 0, filter: 'blur(10px)' },
          { y: 0, opacity: 1, filter: 'blur(0px)', duration: 0.6, ease: 'expo.out' }, 0.65);
        // Scene 2 — question line by line on the voice
        [['l1', 0.6], ['l2', 1.3], ['l3', 2.0]].forEach(function(b){
          tl.fromTo(q(b[0]), { y: 40, opacity: 0, filter: 'blur(14px)' },
            { y: 0, opacity: 1, filter: 'blur(0px)', duration: 0.7, ease: 'power3.out' }, b[1]);
        });
        // a second short buzz while the message is read (mid-shot, deterministic)
        buzz(3.6);
        // Scene 3 — ¡ALERTA! stamp slams on «¡Cuidado!»
        tl.fromTo(stamp, { scale: 1.6, rotation: -4, opacity: 0 },
          { scale: 1, rotation: -4, opacity: 1, duration: 0.22, ease: 'power3.in' }, 6.0);
        var shake = [6, -5, 4, -2, 0];
        for (var j = 0; j < shake.length; j++) {
          tl.to(stamp, { x: shake[j], duration: 0.03, ease: 'none' }, 6.22 + j * 0.03);
        }
        tl.set({}, {}, 7);
        window.__timelines["01-alerta"] = tl;
      })();
    </script>
  </div>
</template>
