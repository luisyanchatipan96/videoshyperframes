<template id="07-descargala-template">
  <div id="root" data-composition-id="07-descargala" data-start="0" data-duration="3.5" data-width="1080" data-height="1920">
    <style>
      @font-face{font-family:'Poppins';src:url('assets/fonts/Poppins_400.woff2') format('woff2');font-weight:400;}@font-face{font-family:'Poppins';src:url('assets/fonts/Poppins_500.woff2') format('woff2');font-weight:500;}@font-face{font-family:'Poppins';src:url('assets/fonts/Poppins_600.woff2') format('woff2');font-weight:600;}@font-face{font-family:'Poppins';src:url('assets/fonts/Poppins_700.woff2') format('woff2');font-weight:700;}@font-face{font-family:'Poppins';src:url('assets/fonts/Poppins_800.woff2') format('woff2');font-weight:800;}
      #root{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:'Poppins',sans-serif;}
      [data-k="bg"]{position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 30%, #FFFFFF 0%, #F5F5F7 60%, #ECEDF1 100%);}
      [data-k="layer"]{position:absolute;inset:0;}
      .descargala-h{position:absolute;left:80px;right:80px;margin:0;text-align:center;color:#04478C;font-weight:700;letter-spacing:-0.03em;line-height:1.05;}
      .descargala-phone{position:absolute;width:460px;height:auto;filter:drop-shadow(0 40px 50px rgba(4,71,140,.2));}
      .descargala-badge{position:absolute;width:410px;height:auto;}
    </style>
    <div data-k="bg" class="clip" data-start="0" data-duration="3.5" data-track-index="0"></div>
    <div id="07-descargala-layer" data-k="layer" class="clip" data-start="0" data-duration="3.5" data-track-index="1">
      <img id="07-descargala-phone-login" class="descargala-phone" src="assets/phone-login.png" alt="" style="left:95px;top:230px;">
      <img id="07-descargala-phone-home" class="descargala-phone" src="assets/phone-home.png" alt="" style="left:525px;top:210px;">
      <p id="07-descargala-title" class="descargala-h" style="top:1300px;font-size:104px;">Descárgala ya.</p>
      <img id="07-descargala-badge-apple" class="descargala-badge" src="assets/badge-app-store.svg" alt="Download on the App Store" style="left:110px;top:1500px;">
      <img id="07-descargala-badge-google" class="descargala-badge" src="assets/badge-google-play.svg" alt="Disponible en Google Play" style="left:560px;top:1500px;">
    </div>
    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
        var q = function (id) { return document.getElementById(id); };
        var tl = gsap.timeline({ paused: true });

        // Scene 1 (0.0–1.2s): phones arrive from below + the sides into their ±6° tilt, scale 0.9→1
        tl.fromTo(q("07-descargala-phone-login"),
          { x: -160, y: 280, rotation: -14, scale: 0.9, opacity: 0 },
          { x: 0, y: 0, rotation: -6, scale: 1, opacity: 1, duration: 1.1, ease: "expo.out" }, 0);
        tl.fromTo(q("07-descargala-phone-home"),
          { x: 160, y: 320, rotation: 14, scale: 0.9, opacity: 0 },
          { x: 0, y: 0, rotation: 6, scale: 1, opacity: 1, duration: 1.1, ease: "expo.out" }, 0.1);

        // Scene 2 (0.9–1.8s): headline clears from blur
        tl.fromTo(q("07-descargala-title"),
          { y: 50, opacity: 0, filter: "blur(16px)" },
          { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.85, ease: "power3.out" }, 0.9);

        // Scene 3 (1.5–3.5s): badges rise in, App Store then Google Play
        tl.fromTo(q("07-descargala-badge-apple"),
          { y: 50, opacity: 0, filter: "blur(10px)" },
          { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.7, ease: "power3.out" }, 1.5);
        tl.fromTo(q("07-descargala-badge-google"),
          { y: 50, opacity: 0, filter: "blur(10px)" },
          { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.7, ease: "power3.out" }, 1.7);

        // Still hold 2.4–3.2s, then final-frame soft fade to the light ground (last 0.3s)
        tl.fromTo(q("07-descargala-layer"),
          { opacity: 1 },
          { opacity: 0, duration: 0.3, ease: "power1.inOut", immediateRender: false }, 3.2);

        tl.set({}, {}, 3.5);
        window.__timelines["07-descargala"] = tl;
      })();
    </script>
  </div>
</template>
