<template id="02-la-nueva-app-template">
  <div id="root" data-composition-id="02-la-nueva-app" data-start="0" data-duration="4" data-width="1080" data-height="1920">
    <style>
      @font-face{font-family:'Poppins';src:url('assets/fonts/Poppins_400.woff2') format('woff2');font-weight:400;}@font-face{font-family:'Poppins';src:url('assets/fonts/Poppins_500.woff2') format('woff2');font-weight:500;}@font-face{font-family:'Poppins';src:url('assets/fonts/Poppins_600.woff2') format('woff2');font-weight:600;}@font-face{font-family:'Poppins';src:url('assets/fonts/Poppins_700.woff2') format('woff2');font-weight:700;}@font-face{font-family:'Poppins';src:url('assets/fonts/Poppins_800.woff2') format('woff2');font-weight:800;}
      #root{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:'Poppins',sans-serif;}
      #root [data-k="bg"]{position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 30%, #FFFFFF 0%, #F5F5F7 60%, #ECEDF1 100%);}
      #root [data-k="layer"]{position:absolute;inset:0;}
      #root .h{position:absolute;left:80px;right:80px;margin:0;text-align:center;color:#04478C;font-weight:700;letter-spacing:-0.03em;line-height:1.05;}
      #root .sub{position:absolute;left:80px;right:80px;margin:0;text-align:center;color:#5B6B7F;font-weight:500;letter-spacing:-0.01em;}
      #root .sub span{display:inline-block;}
      [id="02-la-nueva-app-phone"]{position:absolute;left:266px;top:500px;width:548px;height:1163px;}
      [id="02-la-nueva-app-phone"] img{position:absolute;left:0;top:0;display:block;width:548px;height:auto;filter:drop-shadow(0 50px 60px rgba(4,71,140,.22));}
      [id="02-la-nueva-app-screen"]{position:absolute;left:30px;top:26px;width:487px;height:1052px;border-radius:64px;overflow:hidden;}
      [id="02-la-nueva-app-shine"]{position:absolute;left:-260px;top:-200px;width:260px;height:1452px;transform-origin:50% 50%;background:linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.55) 50%, rgba(255,255,255,0) 100%);}
    </style>
    <div data-k="bg" class="clip" data-start="0" data-duration="4" data-track-index="0"></div>
    <div data-k="layer" class="clip" data-start="0" data-duration="4" data-track-index="1">
      <p id="02-la-nueva-app-title" class="h" style="top:190px;font-size:82px;">Accede a la App Móvil</p>
      <p class="sub" style="top:300px;font-size:46px;line-height:1.25;"><span id="02-la-nueva-app-sub1">de tu Cooperativa</span><br><b id="02-la-nueva-app-sub2" style="color:#2F8A00;font-weight:600;display:inline-block;">San Miguel de los Bancos</b></p>
      <div id="02-la-nueva-app-phone">
        <img id="02-la-nueva-app-phone-img" src="assets/phone-login.png" alt="">
        <div id="02-la-nueva-app-screen" data-layout-allow-overflow><div id="02-la-nueva-app-shine" data-layout-allow-overflow></div></div>
      </div>
    </div>
    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
        var q = function (id) { return document.getElementById("02-la-nueva-app-" + id); };
        var tl = gsap.timeline({ paused: true });

        // Scene 1 (0.0–1.4s): phone rises from below and turns to face camera; shadow grows
        tl.fromTo(q("phone"),
          { y: 500, rotationY: 18, rotationX: 8, scale: 0.9, transformPerspective: 1600 },
          { y: 0, rotationY: 0, rotationX: 0, scale: 1, transformPerspective: 1600, duration: 1.4, ease: "expo.out" }, 0);
        tl.fromTo(q("phone"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0);
        tl.fromTo(q("phone-img"),
          { filter: "drop-shadow(0px 12px 18px rgba(4,71,140,0.06))" },
          { filter: "drop-shadow(0px 50px 60px rgba(4,71,140,0.22))", duration: 1.4, ease: "power3.out" }, 0);

        // Scene 2 (0.6–1.8s): headline lines enter one by one with blur→0
        var blurIn = function (el, at) {
          tl.fromTo(el,
            { opacity: 0, y: 50, filter: "blur(16px)" },
            { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.8, ease: "power3.out" }, at);
        };
        blurIn(q("title"), 0.6);
        blurIn(q("sub1"), 1.0);
        blurIn(q("sub2"), 1.3);

        // Scene 3 (1.8–4.0s): one diagonal light sweep across the screen, then hold
        tl.fromTo(q("shine"),
          { x: 0, rotation: 20 },
          { x: 1100, rotation: 20, duration: 0.8, ease: "power2.inOut" }, 2.0);

        tl.set({}, {}, 4);
        window.__timelines["02-la-nueva-app"] = tl;
      })();
    </script>
  </div>
</template>
