      <p data-hf-id="hf-o45p" id="01-apertura-l3" class="h" style="top:920px;font-size:112px;">tu <span data-hf-id="hf-oy34" class="apertura-01-word">bolsillo.<span data-hf-id="hf-4aoz" id="01-apertura-green" class="g" aria-hidden="true">bolsillo.</span></span></p>

    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var root = document.querySelector('[data-composition-id="01-apertura"]');
        var q = function (id) { return root.querySelector('[id="' + id + '"]'); };
        var logo = q("01-apertura-logo");
        var l1 = q("01-apertura-l1");
        var l2 = q("01-apertura-l2");
        var l3 = q("01-apertura-l3");
        var green = q("01-apertura-green");

        var tl = gsap.timeline({ paused: true });

        // Scene 1 (0.0–0.6s): logo — blur clears + scale 0.96→1
        tl.fromTo(logo,
          { opacity: 0, scale: 0.96, filter: "blur(16px)" },
          { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.6, ease: "power3.out" }, 0);

        // Scene 2 (0.5–2.0s): three headline beats, each line alone (blur 16→0 + opacity + rise 50px)
        var lineIn = function (el, at) {
          tl.fromTo(el,
            { opacity: 0, y: 50, filter: "blur(16px)" },
            { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "power3.out" }, at);
        };
        lineIn(l1, 0.45);
        lineIn(l2, 0.9);
        lineIn(l3, 1.3);

        // «bolsillo.» tints green with a left→right sweep
        tl.fromTo(green,
          { clipPath: "inset(-20% 100% -20% 0%)" },
          { clipPath: "inset(-20% 0% -20% 0%)", duration: 0.5, ease: "power2.inOut" }, 1.5);

        // Scene 3 (2.0–3.0s): quiet hold
        tl.set({}, {}, 3);
        window.__timelines["01-apertura"] = tl;
      })();
