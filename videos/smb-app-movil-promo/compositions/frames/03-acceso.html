    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var P = { user: { x: 55, y: 685 }, huella: { x: 586, y: 685 }, qr: { x: 586, y: 1049 } };

      // Scene 1 (0.0–0.8): headline + card approach
      tl.fromTo("#acceso03-h1", { opacity: 0, y: 50, filter: "blur(16px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "power3.out" }, 0);

      var F = [["#acceso03-b-user", -60, 90, -4, 0.05], ["#acceso03-b-huella", 60, 110, 4, 0.15],
               ["#acceso03-b-verif", -60, 130, 3, 0.25], ["#acceso03-b-qr", 60, 150, -3, 0.35]];
      F.forEach(function (b) {
        tl.fromTo(b[0], { opacity: 0, x: b[1], y: b[2], rotation: b[3], scale: 0.9, filter: "blur(12px)" },
          { opacity: 1, x: 0, y: 0, rotation: 0, scale: 1, filter: "blur(0px)", duration: 0.9, ease: "power3.out" }, b[4]);
      });

      // Scene 2 (0.8–3.2): green line word by word + frame travels the buttons
      var words = [["#acceso03-w1", 0.8], ["#acceso03-w2", 1.4], ["#acceso03-w3", 2.0]];
      words.forEach(function (w) {
        tl.fromTo(w[0], { opacity: 0, y: 50, filter: "blur(16px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "power3.out" }, w[1]);

      tl.to("#acceso03-frame", { x: P.huella.x, y: P.huella.y, duration: 0.45, ease: "power3.inOut" }, 1.0);
      tl.to("#acceso03-c-user", { scale: 1, duration: 0.35, ease: "power3.inOut" }, 1.05);
      tl.fromTo("#acceso03-c-huella", { scale: 1 }, { scale: 1.04, duration: 0.35, ease: "power3.out" }, 1.3);
