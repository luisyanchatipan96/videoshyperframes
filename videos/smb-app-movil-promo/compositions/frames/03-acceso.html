    <div data-k="layer" class="clip" data-start="0" data-duration="4" data-track-index="1">
      <p id="acceso03-h1" class="h" style="top:280px;font-size:92px;">Accede de forma</p>
      <p class="h g" style="top:400px;font-size:76px;font-weight:600;"><span id="acceso03-w1" class="acceso03-w">fácil,</span> <span id="acceso03-w2" class="acceso03-w">rápida</span> <span id="acceso03-w3" class="acceso03-w">y segura.</span></p>
      <div id="acceso03-group" class="acceso03-group">
        <div class="card" style="left:90px;top:700px;width:900px;"><img src="assets/login-opciones.png"></div>
        <!-- crops of the real buttons (measured cells: x 9 / 475, y 11 / 359 in the 900x645 source) -->
        <div id="acceso03-b-user" class="acceso03-btn" style="left:99px;top:711px;background-position:-9px -11px;"></div>
        <div id="acceso03-b-huella" class="acceso03-btn" style="left:565px;top:711px;background-position:-475px -11px;"></div>
        <div id="acceso03-b-qr" class="acceso03-btn" style="left:565px;top:1059px;background-position:-475px -359px;"></div>

      </div>

    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      // frame positions (same offsets as the approved sketch on Huella: left 556, top 686)
      var P = { user: { x: 90, y: 686 }, huella: { x: 556, y: 686 }, qr: { x: 556, y: 1034 } };

      // Scene 1 (0.0–0.8): headline + card approach
      tl.fromTo("#acceso03-h1", { opacity: 0, y: 50, filter: "blur(16px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "power3.out" }, 0);
      tl.fromTo("#acceso03-group", { opacity: 0, scale: 1.08, filter: "blur(16px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.9, ease: "power3.out" }, 0.05);

      // Scene 2 (0.8–3.2): green line word by word + frame travels the buttons
      var words = [["#acceso03-w1", 0.8], ["#acceso03-w2", 1.4], ["#acceso03-w3", 2.0]];
      words.forEach(function (w) {
        tl.fromTo(w[0], { opacity: 0, y: 50, filter: "blur(16px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "power3.out" }, w[1]);
      });

      tl.fromTo("#acceso03-frame", { x: P.user.x, y: P.user.y, opacity: 0, scale: 1.06 },
        { x: P.user.x, y: P.user.y, opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, 0.75);
      tl.fromTo("#acceso03-b-user", { scale: 1 }, { scale: 1.04, duration: 0.35, ease: "power3.out" }, 0.8);

      // → Huella dactilar (lands 1.4)
      tl.to("#acceso03-frame", { x: P.huella.x, y: P.huella.y, duration: 0.45, ease: "power3.inOut" }, 1.0);
      tl.to("#acceso03-b-user", { scale: 1, duration: 0.35, ease: "power3.inOut" }, 1.05);
      tl.fromTo("#acceso03-b-huella", { scale: 1 }, { scale: 1.04, duration: 0.35, ease: "power3.out" }, 1.3);

      // → Pagar con QR (lands 2.0)
      tl.to("#acceso03-frame", { x: P.qr.x, y: P.qr.y, duration: 0.45, ease: "power3.inOut" }, 1.6);
      tl.to("#acceso03-b-huella", { scale: 1, duration: 0.35, ease: "power3.inOut" }, 1.65);
      tl.fromTo("#acceso03-b-qr", { scale: 1 }, { scale: 1.04, duration: 0.35, ease: "power3.out" }, 1.9);

      // back to Huella dactilar, settled by 3.2 (as in the sketch)
      tl.to("#acceso03-frame", { x: P.huella.x, y: P.huella.y, duration: 0.6, ease: "power3.inOut" }, 2.45);
      tl.to("#acceso03-b-qr", { scale: 1, duration: 0.4, ease: "power3.inOut" }, 2.5);
      tl.to("#acceso03-b-huella", { scale: 1.04, duration: 0.4, ease: "power3.out" }, 2.8);

      // Scene 3 (3.2–4.0): hold
      tl.set({}, {}, 4);
      window.__timelines["03-acceso"] = tl;
    </script>
